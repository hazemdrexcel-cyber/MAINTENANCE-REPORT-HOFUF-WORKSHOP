<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقارير اليومية للحركة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
/* الفكرة: شريط علوي ثابت للتاريخ والتبويبات، ثم الملخص قبل التفاصيل، وألوان الحالة ثابتة في كل الصفحة */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --ink:#15212b; --muted:#5b6a77; --line:#dbe2e8;
  --accent:#0b5c7a; --accent-soft:#e2eff4;
  --insp:#6f8399; --prog:#1c8a6f; --wait:#cf4630; --warn:#b97c0d;
  --display:"Cairo","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e151b; --surface:#17212a; --ink:#e7edf2; --muted:#9babb8; --line:#2a3844;
    --accent:#5fbddb; --accent-soft:#143341;
    --insp:#93a7bc; --prog:#43bd9c; --wait:#f1745e; --warn:#e4ad42;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151b; --surface:#17212a; --ink:#e7edf2; --muted:#9babb8; --line:#2a3844;
  --accent:#5fbddb; --accent-soft:#143341;
  --insp:#93a7bc; --prog:#43bd9c; --wait:#f1745e; --warn:#e4ad42;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.head-row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:14px 0 10px}
h1{font-family:var(--display);font-size:24px;margin:0;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.titleblock{border-inline-start:5px solid var(--accent);padding-inline-start:14px;display:flex;flex-direction:column;gap:2px}
.titleblock h1{font-size:30px;font-weight:800;line-height:1.35;color:var(--accent);letter-spacing:0}
.titleblock .sub{font-size:14px}
.credits{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cred{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:8px;padding:4px 12px}
.cred small{font-size:12px;color:var(--muted)}
.cred b{font-size:15px;font-weight:700;color:var(--ink)}
.daybox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.daybox label{font-size:13px;color:var(--muted)}
select,input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:36px}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.tabs a{flex:none;padding:8px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
nav.tabs .cnt{font-size:12px;color:var(--muted);margin-inline-start:4px}
main{padding:20px 0 48px;display:flex;flex-direction:column;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-inline-start:5px solid var(--k,var(--accent));display:flex;flex-direction:column;gap:2px}
.kpi .lab{font-size:13px;color:var(--muted)}
.kpi .val{font-size:34px;font-weight:700;line-height:1.15}
#hr-sum .kpis{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
.kpi .val.sm{font-size:20px;line-height:1.7}
.kpi .dl{font-size:12.5px;color:var(--muted)}
.dl.up{color:var(--wait);font-weight:600}.dl.down{color:var(--prog);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:18px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font-size:17px;margin:0 0 4px;font-weight:700;text-wrap:balance}
.note{color:var(--muted);font-size:13px;margin:0 0 12px}
.change{border-inline-start:5px solid var(--accent);background:var(--accent-soft)}
.change ul{margin:6px 0 0;padding-inline-start:20px}
.change li{margin:2px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.bars{display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:92px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.brow .tot{font-weight:700;text-align:start}
.track{display:flex;height:22px;gap:2px}
.seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;border-radius:3px;min-width:0;overflow:hidden}
.s-insp{background:var(--insp)}.s-prog{background:var(--prog)}.s-wait{background:var(--wait)}.s-acc{background:var(--accent)}
:root[data-theme="dark"] .seg{color:#0e151b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg{color:#0e151b}}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.en{direction:ltr;text-align:right;font-size:13px}
td.r,th.r{text-align:left;white-space:nowrap}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid currentColor}
.p-insp{color:var(--insp)}.p-prog{color:var(--prog)}.p-wait{color:var(--wait)}.p-warn{color:var(--warn)}
.old{color:var(--wait);font-weight:700}
.meter{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--prog)}
.big{font-size:26px;font-weight:700}
ol.obs{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px}
ol.obsfull{margin:0;padding-inline-start:24px;display:flex;flex-direction:column;gap:12px}
ol.obsfull>li::marker{font-weight:700;color:var(--accent)}
.supbox{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.donegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
.dbtn{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:6px;padding:2px 4px;cursor:pointer;text-align:start;width:100%}
.dbtn:hover{background:var(--bg)}
.dbtn[aria-pressed="true"]{border-color:var(--prog);background:color-mix(in srgb,var(--prog) 10%,var(--surface));font-weight:700}
.dbtn .track{display:flex}
table.hist thead tr:first-child th{border-bottom:0;padding-bottom:0;vertical-align:bottom}
.trend{display:inline-flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:12px;font-weight:600}
.trend svg{display:block}
.trend polyline{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trend circle{fill:currentColor}
.trend.good{color:var(--prog)}.trend.bad{color:var(--wait)}.trend.flat{color:var(--muted)}
.since{font-size:11px;font-weight:500}.since.good{color:var(--prog)}.since.bad{color:var(--wait)}
.fsum{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:20px;align-items:center}
@media (max-width:640px){.fsum{grid-template-columns:1fr}}
.fbig{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.fbig .lab{font-size:13px;color:var(--muted)}.fbig .val{font-size:40px;font-weight:700;line-height:1.15}.fbig .sub2{font-size:13px;color:var(--muted)}
.okt{color:var(--prog)}.midt{color:var(--warn)}.lowt{color:var(--wait)}
.fbars{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:84px 1fr 120px;gap:10px;align-items:center;font-size:14px}
.ftrack{position:relative;height:18px;background:var(--line);border-radius:4px;overflow:visible}
.ffill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:4px}
.ffill.ok,.dot.fok{background:var(--prog)}.ffill.mid,.dot.fmid{background:var(--warn)}.ffill.low,.dot.flow{background:var(--wait)}
.fref{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.dot.fline{background:var(--ink);opacity:.55;width:3px;border-radius:0}
.fval small{color:var(--muted)}.fna{color:var(--muted);font-size:13px}
.sub-sec{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.chartwrap{width:100%;overflow-x:auto}
.rchart{width:100%;min-width:520px;height:auto;display:block}
.rchart .cg{stroke:var(--line);stroke-width:1}.rchart .cy,.rchart .cx{fill:var(--muted);font-size:11px;font-family:var(--body)}.rchart .cy{text-anchor:end}
.rchart .cref{stroke:var(--prog);stroke-opacity:.8;stroke-width:1.5;stroke-dasharray:6 4}.rchart .crefl{fill:var(--prog);font-size:11.5px;font-weight:600;font-family:var(--body)}
.rchart .cline{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.rchart .sok{stop-color:var(--prog)}.rchart .smid{stop-color:var(--warn)}.rchart .slow{stop-color:var(--wait)}
.rchart .bok{fill:var(--prog);opacity:.07}.rchart .bmid{fill:var(--warn);opacity:.10}.rchart .blow{fill:var(--wait);opacity:.08}
.rchart .cv.ok{fill:var(--prog)}.rchart .cv.mid{fill:var(--warn)}.rchart .cv.low{fill:var(--wait)}
.rchart circle{stroke:var(--surface);stroke-width:2.5}.rchart circle.ok{fill:var(--prog)}.rchart circle.mid{fill:var(--warn)}.rchart circle.low{fill:var(--wait)}
.rchart .cv{fill:var(--ink);font-size:10.5px;font-weight:600;font-family:var(--body)}.rchart .cv.last{font-size:13px;font-weight:700}
table.heat{width:auto;min-width:100%}
table.heat th{text-align:center;padding:6px 4px}
.hc{text-align:center;padding:6px 4px;font-size:13px;font-weight:600;min-width:46px;font-variant-numeric:tabular-nums}
.hc.ok{background:color-mix(in srgb,var(--prog) 22%,var(--surface))}.hc.mid{background:color-mix(in srgb,var(--warn) 30%,var(--surface))}
.hc.low{background:color-mix(in srgb,var(--wait) 32%,var(--surface))}.hc.na{color:var(--muted);font-weight:400}
.hp{white-space:nowrap;font-weight:600}
tr.htot td{border-top:2px solid var(--line);font-weight:700}
.hc.mv i{font-style:normal;font-size:10px;margin-inline-start:2px}.hc.mv.up{color:var(--accent)}.hc.mv.dn{color:var(--wait)}
.hc.mv{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
:root{--side-bg:#0a3b4f;--side-ink:#e6f1f5;--side-muted:#9cc0cf;--side-active:#ffffff}
:root[data-theme="dark"]{--side-bg:#0b1a22;--side-ink:#e7edf2;--side-muted:#8fa6b4;--side-active:#5fbddb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--side-bg:#0b1a22;--side-ink:#e7edf2;--side-muted:#8fa6b4;--side-active:#5fbddb}}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--side-bg);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;padding:22px 16px}
.brand{display:flex;flex-direction:column;gap:2px;padding-bottom:16px;border-bottom:1px solid color-mix(in srgb,var(--side-ink) 18%,transparent)}
.brand small{color:var(--side-muted);font-size:12.5px}.brand b{font-family:var(--display);font-size:21px;line-height:1.35}
.slabel{font-size:12px;color:var(--side-muted);margin-top:4px}
.sidenav{display:flex;flex-direction:column;gap:8px}
.snav{font:inherit;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--side-ink);border-inline-start:4px solid transparent}
.snav b{font-size:17px}.snav small{font-size:12.5px;color:var(--side-muted)}
.snav:hover{background:color-mix(in srgb,var(--side-ink) 8%,transparent)}
.snav[aria-pressed="true"]{background:color-mix(in srgb,var(--side-ink) 14%,transparent);border-inline-start-color:var(--side-active)}
.snav[aria-pressed="true"] small{color:var(--side-ink)}
.snav:focus-visible{outline:2px solid var(--side-active);outline-offset:2px}
.content{min-width:0}
.content .wrap{max-width:1180px}
nav.tabs[hidden]{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px}
  .brand{border-bottom:0;padding-bottom:0;margin-inline-end:auto}.brand b{font-size:17px}
  .slabel{display:none}.sidenav{flex-direction:row;flex-wrap:wrap}
  .snav{padding:8px 12px}.snav small{display:none}
}
.ind{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:start;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);min-width:96px;max-width:150px;font-weight:400;white-space:normal}
.ind .iw{font-size:13.5px;font-weight:700}
.ind .ir{font-size:12px;color:var(--ink)}.ind .ir b{font-variant-numeric:tabular-nums}
.ind .iy{font-size:11.5px;color:var(--muted)}
.ind.good{border-color:color-mix(in srgb,var(--prog) 45%,transparent);background:color-mix(in srgb,var(--prog) 9%,var(--surface))}.ind.good .iw{color:var(--prog)}
.ind.bad{border-color:color-mix(in srgb,var(--wait) 45%,transparent);background:color-mix(in srgb,var(--wait) 8%,var(--surface))}.ind.bad .iw{color:var(--wait)}
.ind.flat .iw{color:var(--muted)}
.iy.good{color:var(--prog)}.iy.bad{color:var(--wait)}
table.hist thead tr:first-child th{padding:0 3px 8px}
table.hist th,table.hist td{padding-inline:6px}
.aging{display:flex;height:26px;gap:2px;margin:10px 0 6px}
.aging div{border-radius:3px;min-width:2px}
.a0{background:color-mix(in srgb,var(--wait) 14%,var(--surface))}.a1{background:color-mix(in srgb,var(--wait) 28%,var(--surface))}
.a2{background:color-mix(in srgb,var(--wait) 42%,var(--surface))}.a3{background:color-mix(in srgb,var(--wait) 58%,var(--surface))}
.a4{background:color-mix(in srgb,var(--wait) 78%,var(--surface))}.a5{background:var(--wait)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input[type=search]{flex:1 1 220px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:4px 12px;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.more{font-size:13px;color:var(--accent);font-weight:600}
.empty{color:var(--muted);padding:12px 0}
@media (max-width:480px){h1,.titleblock h1{font-size:22px}.kpi .val{font-size:28px}.brow{grid-template-columns:78px 1fr 28px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side" aria-label="اختيار التقرير">
  <div class="brand"><small>قسم الحركة والمعدات</small><b>التقارير اليومية للحركة</b></div>
  <div class="slabel">اختر التقرير</div>
  <nav class="sidenav" id="sidenav"></nav>
</aside>
<div class="content">
<header class="top">
  <div class="wrap">
    <div class="head-row">
      <div class="titleblock">
        <h1 id="h1">تقرير المعدات اليومي</h1>
        <div class="sub" id="hsub"></div>
        <div class="credits"><span class="cred"><small>مصدر البيانات</small><b id="src">أ/ عثمان النور</b></span><span class="cred"><small>إعداد التقرير</small><b>حازم حسن</b></span></div>
      </div>
      <div class="daybox">
        <label for="day">تاريخ التقرير</label>
        <select id="day"></select>
        <span class="sub" id="cmp"></span>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="أقسام التقرير"></nav>
  </div>
</header>
<div class="wrap"><main id="main"></main></div>
</div>

<script>
(function(){
"use strict";
var RAW = JSON.parse(document.getElementById("data").textContent), DATA = RAW.days, HR = (RAW.hr||[]).slice().sort(function(a,b){return a.date.localeCompare(b.date);});
var DAYS = Object.keys(DATA).sort();
var MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
var ST = {insp:"قيد الفحص", prog:"جاري العمل", wait:"بانتظار قطع غيار"};
var ST_ORDER = ["wait","prog","insp"];

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fd(iso, short){ if(!iso) return "—"; var p=iso.split("-"); if(p.length!==3) return esc(iso); return (+p[2])+" "+MONTHS[+p[1]-1]+(short?"":" "+p[0]); }

function money(n){ return Math.round(n).toLocaleString("en-US"); }
function count(arr, fn){ var n=0; arr.forEach(function(x){ if(fn(x)) n++; }); return n; }

function prevDay(d){ var i=DAYS.indexOf(d); return i>0?DAYS[i-1]:null; }

function metrics(d){

  return {
    stopped:D.breakdowns.length,
    wait:count(D.breakdowns,function(x){return x.status==="wait";}),
    prog:count(D.breakdowns,function(x){return x.status==="prog";}),

}
function delta(now, before, goodWhenUp, pd){
  if(before==null) return '<span class="dl">أول يوم في السجل</span>';
  var x=now-before;
  if(x===0) return '<span class="dl">بدون تغيير عن '+fd(pd,true)+'</span>';
  var bad = goodWhenUp ? x<0 : x>0;
  return '<span class="dl '+(bad?"up":"down")+'">'+(x>0?"▲ ":"▼ ")+Math.abs(x)+' عن '+fd(pd,true)+'</span>';
}
function pill(s){ return '<span class="pill p-'+s+'">'+ST[s]+'</span>'; }

function changes(d){
  var p=prevDay(d); if(!p) return null;
  var A=DATA[p], B=DATA[d], out=[];
  var pm={}; A.breakdowns.forEach(function(x){pm[x.code]=x;});
  var nm={}; B.breakdowns.forEach(function(x){nm[x.code]=x;});
  var entered=B.breakdowns.filter(function(x){return !pm[x.code];});
  var left=A.breakdowns.filter(function(x){return !nm[x.code];});
  var moved=B.breakdowns.filter(function(x){return pm[x.code]&&pm[x.code].status!==x.status;});
  function names(l){ return l.map(function(x){return esc(x.type)+" "+esc(x.code);}).join("، "); }
  if(entered.length) out.push("دخلت الورشة "+entered.length+" معدة: "+names(entered));
  if(left.length) out.push("خرجت من قائمة المتوقف "+left.length+" معدة: "+names(left));

  function diffSet(a,b,key){ var s={}; a.forEach(function(x){s[key(x)]=1;}); return b.filter(function(x){return !s[key(x)];}); }
  var kd=function(x){return x.code+"|"+x.out;}, ks=function(x){return x.code+"|"+x.need;}, ko=function(x){return x;};
  var nd=diffSet(A.done,B.done,kd); if(nd.length) out.push("أعمال منجزة جديدة: "+nd.length+" ("+names(nd)+")");
  var ns=diffSet(A.sites,B.sites,ks), cs=diffSet(B.sites,A.sites,ks);

  var pp={}; A.plan.forEach(function(x){pp[x.code+"|"+x.job]=x.status;});
  var pc=B.plan.filter(function(x){var o=pp[x.code+"|"+x.job]; return o&&o!==x.status;});
  if(pc.length) out.push("تغيّرت حالة "+pc.length+" من أعمال الخطة الأسبوعية");
  var dd=metrics(d).debt-metrics(p).debt;
  if(Math.abs(dd)>=1) out.push("أرصدة الموردين "+(dd>0?"زادت":"انخفضت")+" بمقدار "+money(Math.abs(dd))+" ريال");
  return {prev:p, items:out};
}

function typeBars(D){
  var g=groupBy(D.breakdowns,function(x){return x.type;});
  var rows=Object.keys(g).map(function(t){ var r={type:t,total:g[t].length}; ST_ORDER.forEach(function(s){ r[s]=count(g[t],function(x){return x.status===s;}); }); return r; })
    .sort(function(a,b){return b.total-a.total;});
  var max=rows.length?rows[0].total:1;
  return '<div class="legend">'+ST_ORDER.map(function(s){return '<span><i class="dot s-'+s+'"></i>'+ST[s]+'</span>';}).join("")+'</div><div class="bars">'+
    rows.map(function(r){

        return r[s]?'<div class="seg s-'+s+'" style="width:'+(r[s]/max*100)+'%" title="'+ST[s]+': '+r[s]+'">'+r[s]+'</div>':"";
      }).join("")+'</div><span class="tot num">'+r.total+'</span></div>';
    }).join("")+'</div>';
}

    return '<div class="brow"><span>'+esc(p[0])+'</span><div class="track"><div class="seg '+cls+'" style="width:'+(p[1]/max*100)+'%">'+p[1]+'</div></div><span class="tot num"></span></div>';
  }).join("")+'</div>';
}
function waitingRows(D,d){
  return D.breakdowns.filter(function(x){return x.status==="wait";}).map(function(x){
    return {x:x, days:x.reqDate?daysBetween(x.reqDate,d):null};
  }).sort(function(a,b){return (b.days==null?-1:b.days)-(a.days==null?-1:a.days);});
}
function waitTable(rows){
  return '<div class="tw"><table><thead><tr><th>الكود</th><th>النوع</th><th>العطل</th><th>رقم الطلب</th><th>تاريخ الطلب</th><th class="r">أيام الانتظار</th></tr></thead><tbody>'+
    rows.map(function(r){ return '<tr><td class="num">'+esc(r.x.code)+'</td><td>'+esc(r.x.type)+'</td><td class="en">'+esc(r.x.trouble)+'</td><td class="num">'+esc(r.x.req||"—")+'</td><td style="white-space:nowrap">'+fd(r.x.reqDate)+'</td><td class="r num '+(r.days>=90?"old":"")+'">'+(r.days==null?"—":r.days)+'</td></tr>'; }).join("")+
    '</tbody></table></div>';
}

function renderSummary(){

  h+='<div class="kpis">'+

    kpi("أعمال منجزة",m.done,delta(m.done,pm.done,true,p),"--prog")+

  var byOut=groupBy(D.done,function(x){return x.out||"";}), outs=Object.keys(byOut).sort();

  var pct=m.plan?Math.round(m.planDone/m.plan*100):0, open=D.plan.filter(function(x){return x.status!=="done";});

function ind(vals, dir, kind, firstDay){
  var n=vals.length, last=vals[n-1], first=vals[0], prev=n>1?vals[n-2]:null;
  var eps=kind==="pct"?0.0005:(kind==="money"?1:0.5);
  var val=function(v){return kind==="pct"?pct(v):kind==="money"?money(v):v;};
  var dif=function(x){return kind==="pct"?(Math.abs(x)*100).toFixed(1)+" نقطة":kind==="money"?money(Math.abs(x)):Math.abs(x);};
  function word(x){
    if(Math.abs(x)<eps) return {c:"flat",w:"ثابت",a:"●"};
    if(dir===0) return {c:"flat",w:x>0?"زاد":"نقص",a:x>0?"▲":"▼"};
    var good=x*dir>0; return {c:good?"good":"bad",w:good?"تحسّن":"تراجع",a:x>0?"▲":"▼"};
  }
  if(n<2) return '<span class="ind flat"><span class="iw">يوم واحد في السجل</span></span>';
  var s=word(last-first), y=word(last-prev);
  return '<span class="ind '+s.c+'"><span class="iw">'+s.a+' '+s.w+(Math.abs(last-first)>=eps?' '+dif(last-first):'')+'</span>'+
    '<span class="ir">من <b><bdi dir="ltr">'+val(first)+'</bdi></b> إلى <b><bdi dir="ltr">'+val(last)+'</bdi></b></span>'+
    '<span class="iy '+y.c+'">عن اليوم السابق: '+(Math.abs(last-prev)<eps?'ثابت':y.a+' '+dif(last-prev))+'</span></span>';
}
function trend(vals, goodDir, isMoney){
  var n=vals.length, last=vals[n-1], prev=n>1?vals[n-2]:null, first=vals[0];
  var dx=prev==null?0:last-prev, cls="flat", arrow="●", txt="ثابت";
  if(prev==null){ txt="يوم واحد"; }
  else if(Math.abs(dx)>=(isMoney?1:0.5)){ var good=dx*goodDir>0; cls=good?"good":"bad"; arrow=dx>0?"▲":"▼"; txt=(isMoney?money(Math.abs(dx)):Math.abs(dx)); }
  var w=72,hgt=22,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),rng=max-min||1;
  var pts=vals.map(function(v,i){ var x=n>1?i/(n-1)*(w-6)+3:w/2; var y=max===min?hgt/2:hgt-3-(v-min)/rng*(hgt-6); return [x,y]; });
  var line=pts.length>1?'<polyline points="'+pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ")+'" />':'';
  var e=pts[pts.length-1], tot=last-first, totGood=tot*goodDir>0;
  var since=n>2&&Math.abs(tot)>=(isMoney?1:0.5)?'<span class="since '+(totGood?"good":"bad")+'">منذ البداية <bdi dir="ltr">'+(tot>0?"+":"−")+(isMoney?money(Math.abs(tot)):Math.abs(tot))+'</bdi></span>':'';
  return '<span class="trend '+cls+'"><svg viewBox="0 0 '+w+' '+hgt+'" width="'+w+'" height="'+hgt+'" aria-hidden="true">'+line+'<circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="3"/></svg><span class="tv">'+arrow+' '+txt+'</span>'+since+'</span>';
}

function trendF(vals,dir,isPct){
  var n=vals.length,last=vals[n-1],prev=n>1?vals[n-2]:null,first=vals[0];
  var dx=prev==null?0:last-prev, cls="flat", arrow="●", txt="ثابت", eps=isPct?0.0005:0.5;
  var f=function(x){return isPct?(Math.abs(x)*100).toFixed(1)+"ن":Math.abs(x);};
  if(prev==null) txt="يوم واحد"; else if(Math.abs(dx)>=eps){ cls=dir===0?"flat":(dx*dir>0?"good":"bad"); arrow=dx>0?"▲":"▼"; txt=f(dx); }
  var w=72,h=22,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=mx-mn||1;
  var pts=vals.map(function(v,i){return [n>1?i/(n-1)*(w-6)+3:w/2, mx===mn?h/2:h-3-(v-mn)/rg*(h-6)];});
  var tot=last-first, since=n>2&&Math.abs(tot)>=eps?'<span class="since '+(dir===0?"":(tot*dir>0?"good":"bad"))+'">منذ البداية <bdi dir="ltr">'+(tot>0?"+":"−")+f(tot)+'</bdi></span>':'';
  return '<span class="trend '+cls+'"><svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true">'+(n>1?'<polyline points="'+pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ")+'"/>':'')+'<circle cx="'+pts[n-1][0].toFixed(1)+'" cy="'+pts[n-1][1].toFixed(1)+'" r="3"/></svg><span class="tv">'+arrow+' '+txt+'</span>'+since+'</span>';
}
function fleetCard(d){
  if(!FDAYS.length) return "";
  var a=fAt(d); if(!a.d) return "";
  var t=fTot(a.d), pt=a.p?fTot(a.p):null;
  return '<section class="card" id="fleet-sum"><h2>تشغيل النقليات</h2><p class="note">بيانات يوم '+fd(a.d)+fLag(a.d,d)+'. <a class="more" href="#fleet">التفاصيل</a></p>'+
    '<div class="fsum"><div class="fbig"><span class="lab">نسبة التشغيل الإجمالية</span><span class="val num '+rCls(t.ratio)+'t">'+pct(t.ratio)+'</span><span class="sub2">'+t.in+' في الخدمة من '+t.tot+' سيارة</span>'+fDelta(t.ratio,pt&&pt.ratio,1,true,a.p)+'</div><div>'+projBars(a.d)+'</div></div></section>';
}
var FLEETTAB={title:"تشغيل النقليات", body:function(){
  var a=fAt(state.fDay); if(!a.d) return '<p class="empty">لا توجد بيانات نقليات.</p>';
  var d=a.d, p=a.p, t=fTot(d), pt=p?fTot(p):{}, upto=FDAYS.filter(function(x){return x<=d;});
  var h='<p class="note">بيانات يوم '+fd(d)+'</p><div class="kpis">'+
    '<div class="kpi" style="--k:var(--prog)"><span class="lab">نسبة التشغيل</span><span class="val num">'+pct(t.ratio)+'</span>'+fDelta(t.ratio,pt.ratio,1,true,p)+'</div>'+
    '<div class="kpi" style="--k:var(--prog)"><span class="lab">في الخدمة</span><span class="val num">'+t.in+'</span>'+fDelta(t.in,pt.in,1,false,p)+'</div>'+
    '<div class="kpi" style="--k:var(--wait)"><span class="lab">خارج الخدمة</span><span class="val num">'+t.out+'</span>'+fDelta(t.out,pt.out,-1,false,p)+'</div>'+
    '<div class="kpi" style="--k:var(--accent)"><span class="lab">إجمالي السيارات</span><span class="val num">'+t.tot+'</span>'+fDelta(t.tot,pt.tot,0,false,p)+'</div></div>';
  h+='<div class="sub-sec"><h2>نسبة التشغيل اليومية</h2>'+ratioChart(upto)+'</div>';
  h+='<div class="sub-sec"><h2>نسبة التشغيل</h2><p class="note">مرتبة من الأضعف، يوم '+fd(d,true)+'</p>'+projBars(d)+'</div>';
  h+='<div class="sub-sec"><h2>نسبة التشغيل يومًا بيوم (%)</h2><p class="note">مرّر على أي خانة لعرض عدد السيارات.</p>'+heat(upto)+'</div>';
  h+='<div class="sub-sec"><h2>عدد سيارات كل مشروع (حركة السيارات بين المشاريع)</h2><p class="note">السهم يعني أن عدد سيارات المشروع تغيّر عن اليوم السابق، غالبًا بسبب نقل سيارات بين المشاريع.</p>'+moves(upto)+'</div>';
  var C=[["ratio","نسبة التشغيل",1,true],["in","في الخدمة",1,false],["out","خارج الخدمة",-1,false],["tot","إجمالي السيارات",0,false]];
  h+='<div class="sub-sec"><h2>سجل الأيام واتجاه المؤشرات</h2><p class="note">فوق كل عمود: هل المؤشر تحسّن أو تراجع من أول يوم ('+fd(upto[0],true)+') حتى '+fd(d,true)+'، ثم الفرق عن اليوم السابق. الأخضر تحسّن والأحمر تراجع.</p><div class="tw"><table class="hist"><thead><tr><th></th>'+C.map(function(c){return '<th class="r">'+ind(upto.map(function(x){return fTot(x)[c[0]];}),c[2],c[3]?"pct":"num")+'</th>';}).join("")+'</tr><tr><th>التاريخ</th>'+C.map(function(c){return '<th class="r">'+c[1]+'</th>';}).join("")+'</tr></thead><tbody>'+
    upto.slice().reverse().map(function(x){var k=fTot(x);return '<tr'+(x===d?' style="font-weight:700"':'')+'><td style="white-space:nowrap">'+fd(x)+'</td><td class="r num">'+pct(k.ratio)+'</td><td class="r num">'+k.in+'</td><td class="r num">'+k.out+'</td><td class="r num">'+k.tot+'</td></tr>';}).join("")+'</tbody></table></div><p class="note" style="margin:6px 0 0">النسبة الإجمالية = مجموع السيارات في الخدمة ÷ إجمالي السيارات، وليست متوسط نسب المشاريع. «نقطة» تعني نقطة مئوية: من 90% إلى 93% زيادة 3 نقاط.</p></div>';
  return h; }, noTools:true};

function sideNav(){
  var m=metrics(DAYS[DAYS.length-1]), fl=FDAYS.length?fTot(FDAYS[FDAYS.length-1]):null;
  var items=[["eq","المعدات","ورشة الهفوف: "+m.stopped+" معدة متوقفة"],["fleet","النقليات",fl?"نسبة التشغيل "+pct(fl.ratio):"لا توجد بيانات"]];
  document.getElementById("sidenav").innerHTML=items.map(function(it){
    return '<button type="button" class="snav" data-sec="'+it[0]+'" aria-pressed="'+(state.sec===it[0])+'"><b>'+it[1]+'</b><small>'+esc(it[2])+'</small></button>'; }).join("");
}
function fillDays(){
  var list=state.sec==="fleet"?FDAYS:DAYS, cur=state.sec==="fleet"?state.fDay:state.day, sel=document.getElementById("day");
  sel.innerHTML=list.slice().reverse().map(function(d){return '<option value="'+d+'">'+fd(d)+'</option>';}).join("");
  sel.value=cur;
}
var HEADS={eq:["تقرير المعدات اليومي","ورشة الهفوف، قسم الحركة والمعدات","أ/ عثمان النور"],fleet:["تقرير تشغيل النقليات","نسبة تشغيل السيارات حسب المشروع","محمد عثمان"]};
function render(){
  var main=document.getElementById("main"), tabs=document.getElementById("tabs");
  document.getElementById("h1").textContent=HEADS[state.sec][0];
  document.getElementById("hsub").textContent=HEADS[state.sec][1];
  document.getElementById("src").textContent=HEADS[state.sec][2];
  sideNav(); fillDays();
  if(state.sec==="fleet"){
    var fp=null; FDAYS.forEach(function(x){ if(x<state.fDay) fp=x; });
    document.getElementById("cmp").textContent = fp ? "المقارنة مع "+fd(fp,true) : "";
    tabs.hidden=true;
    main.innerHTML='<section class="card">'+FLEETTAB.body()+'</section>';
    return;
  }
  tabs.hidden=false;
  var D=DATA[state.day], p=prevDay(state.day);
  document.getElementById("cmp").textContent = p ? "المقارنة مع "+fd(p,true) : "";
  var cnt={breakdowns:D.breakdowns.length,done:D.done.length,sites:D.sites.length,plan:D.plan.length};
  tabs.innerHTML = TABS.map(function(t){ return '<a href="#'+t[0]+'"'+(t[0]===state.tab?' aria-current="page"':'')+'>'+t[1]+(cnt[t[0]]!=null?'<span class="cnt num">'+cnt[t[0]]+'</span>':'')+'</a>'; }).join("");
  if(state.tab==="summary"){ main.innerHTML=renderSummary();
    main.querySelectorAll(".dbtn").forEach(function(b){ b.addEventListener("click",function(){ state.doneDay=b.getAttribute("data-out"); var y=window.scrollY; render(); try{window.scrollTo(0,y);}catch(e){} }); });
    return; }
  var def=DETAIL[state.tab];
  main.innerHTML='<section class="card"><h2>'+def.title+'</h2><p class="note">بيانات يوم '+fd(state.day)+'</p>'+tools(def.chips?def.chips(D):null)+'</section>';
  document.getElementById("tbl").innerHTML=def.body(D);
  var q=document.getElementById("q");
  q.addEventListener("input",function(){ state.q=q.value.trim(); document.getElementById("tbl").innerHTML=def.body(D); });
  main.querySelectorAll(".chip").forEach(function(b){ b.addEventListener("click",function(){ state.f=b.getAttribute("data-f"); render(); }); });
}
function isTab(h){ return TABS.some(function(t){return t[0]===h;}); }
function go(h){
  if(h==="fleet"){ state.sec="fleet"; }
  else { state.sec="eq"; state.tab=isTab(h)?h:"summary"; }
  state.q=""; state.f="all"; render(); try{ window.scrollTo(0,0); }catch(e){}
  try{ history.replaceState(null,"","#"+h); }catch(e){}
}
document.getElementById("day").addEventListener("change",function(ev){
  if(state.sec==="fleet") state.fDay=ev.target.value; else { state.day=ev.target.value; state.f="all"; state.doneDay=null; }
  render();
});
document.addEventListener("click",function(ev){
  var b=ev.target&&ev.target.closest?ev.target.closest(".snav"):null;
  if(b){ go(b.getAttribute("data-sec")==="fleet"?"fleet":"summary"); return; }
  var a=ev.target&&ev.target.closest?ev.target.closest('a[href^="#"]'):null; if(!a) return;
  var h=a.getAttribute("href").slice(1);
  if(h!=="fleet"&&!isTab(h)) return;
  ev.preventDefault(); go(h);
});
window.addEventListener("hashchange",function(){ var h=(location.hash||"").replace("#",""); if(h==="fleet"?state.sec!=="fleet":(isTab(h)&&(state.sec!=="eq"||h!==state.tab))) go(h); });
(function(){ var h=(location.hash||"").replace("#",""); if(h==="fleet") state.sec="fleet"; else if(isTab(h)) state.tab=h; render(); })();
})();
</script>
